name: Build and Publish APK Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true 
          
      - name: Generate Android platform
        working-directory: src/mobile_app
        run: flutter create . --platforms android

      - name: Get dependencies
        working-directory: src/mobile_app
        run: flutter pub get
        
      - name: Patch flutter_inappwebview for AGP 9
        working-directory: src/mobile_app
        shell: bash
        run: |
          set -euo pipefail

          pub_cache="${PUB_CACHE:-$HOME/.pub-cache}"
          plugin_gradle="$(find "$pub_cache/hosted" \
            -type f \
            -path '*/flutter_inappwebview_android-*/android/build.gradle' \
            -print -quit 2>/dev/null || true)"

          if [ -z "$plugin_gradle" ]; then
            echo "No se encontró flutter_inappwebview_android en $pub_cache" >&2
            exit 1
          fi

          sed -i \
            's/proguard-android\.txt/proguard-android-optimize.txt/g' \
            "$plugin_gradle"

          if grep -q 'proguard-android\.txt' "$plugin_gradle"; then
            echo "El plugin todavía usa proguard-android.txt: $plugin_gradle" >&2
            exit 1
          fi

          echo "Plugin parcheado: $plugin_gradle"
          grep -n 'proguardFiles' "$plugin_gradle"
     
      - name: Build APK (Release)
        working-directory: src/mobile_app
        run: flutter build apk --release
      
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src/mobile_app/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: src/mobile_app/build/app/outputs/apk/release/app-release.apk
