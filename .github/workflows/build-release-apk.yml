name: Build and Publish APK Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true 
          
      - name: Generate Android platform
        working-directory: src/mobile_app
        run: flutter create . --platforms android

      - name: Get dependencies
        working-directory: src/mobile_app
        run: flutter pub get
        
      - name: Patch plugins for AGP 9 / compileSdk 36
        working-directory: src/mobile_app
        run: |
          set -euo pipefail
          cache="${PUB_CACHE:-$HOME/.pub-cache}"

          props="android/gradle.properties"
          if [ -f "$props" ] && ! grep -q 'android.r8.proguardAndroidTxt.disallowed' "$props"; then
            echo 'android.r8.proguardAndroidTxt.disallowed=false' >> "$props"
          fi

          # ProGuard: no cambiar el nombre de la propiedad, solo el archivo
          while IFS= read -r -d '' f; do
            if grep -q 'proguard-android.txt' "$f"; then
              sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
              echo "ProGuard: $f"
            fi
          done < <(find "$cache" \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)

          # compileSdk: conservar compileSdkVersion (Groovy) o compileSdk (KTS)
          while IFS= read -r -d '' f; do
            if grep -qE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*33' "$f"; then
              sed -i -E \
                -e 's/compileSdkVersion[[:space:]]*=?[[:space:]]*33/compileSdkVersion 36/g' \
                -e 's/compileSdk[[:space:]]*=[[:space:]]*33/compileSdk = 36/g' \
                -e 's/compileSdk[[:space:]]+33/compileSdk 36/g' \
                "$f"
              echo "compileSdk: $f"
            fi
          done < <(find "$cache" \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0)

          echo "=== android_intent_plus compileSdk ==="
          grep -n -E 'compileSdk' "$cache"/hosted/pub.dev/android_intent_plus-*/android/build.gradle \
            || grep -n -E 'compileSdk' "$cache"/hosted/*/android_intent_plus-*/android/build.gradle

      - name: Build APK (Release)
        working-directory: src/mobile_app
        run: flutter build apk --release
      
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src/mobile_app/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: src/mobile_app/build/app/outputs/apk/release/app-release.apk
