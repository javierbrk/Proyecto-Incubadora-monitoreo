name: Build and Publish APK Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true 
          
      - name: Generate Android platform
        working-directory: src/mobile_app
        run: flutter create . --platforms android

      - name: Get dependencies
        working-directory: src/mobile_app
        run: flutter pub get

      - name: Patch AGP 9 ProGuard (flutter_inappwebview)
        working-directory: src/mobile_app
        run: |
          set -euo pipefail
          props="android/gradle.properties"
          if [ -f "$props" ] && ! grep -q 'android.r8.proguardAndroidTxt.disallowed' "$props"; then
            echo 'android.r8.proguardAndroidTxt.disallowed=false' >> "$props"
          fi
          cache="${PUB_CACHE:-$HOME/.pub-cache}"
          find "$cache" \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 \
            | xargs -0 grep -l "proguard-android.txt" \
            | while IFS= read -r f; do
                sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
                echo "Patched $f"
              done

      - name: Build APK (Release)
        working-directory: src/mobile_app
        run: flutter build apk --release
      
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src/mobile_app/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: src/mobile_app/build/app/outputs/apk/release/app-release.apk
