name: Build and Publish APK Release

on:
  release:
    types: [created]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      
      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      
      - name: Setup Flutter
        uses: subosito/flutter-action@v2
        with:
          flutter-version: '3.47.4'
          channel: 'stable'
          cache: true 
          
      - name: Generate Android platform
        working-directory: src/mobile_app
        run: flutter create . --platforms android

      - name: Get dependencies
        working-directory: src/mobile_app
        run: flutter pub get

      - name: Patch plugins for AGP 9 / compileSdk 36
        working-directory: src/mobile_app
        run: |
          set -euo pipefail
          cache="${PUB_CACHE:-$HOME/.pub-cache}"

          # 1) AGP 9: proguard-android.txt ya no existe
          props="android/gradle.properties"
          if [ -f "$props" ] && ! grep -q 'android.r8.proguardAndroidTxt.disallowed' "$props"; then
            echo 'android.r8.proguardAndroidTxt.disallowed=false' >> "$props"
          fi
          find "$cache" \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 \
            | xargs -0 grep -l "proguard-android.txt" \
            | while IFS= read -r f; do
                sed -i 's/proguard-android\.txt/proguard-android-optimize.txt/g' "$f"
                echo "Patched ProGuard in $f"
              done

          # 2) Plugins con compileSdk 33 (android_intent_plus 4.x, etc.)
          find "$cache" \( -name 'build.gradle' -o -name 'build.gradle.kts' \) -print0 \
            | xargs -0 grep -lE 'compileSdk(Version)?[[:space:]]*=?[[:space:]]*33' \
            | while IFS= read -r f; do
                sed -i -E 's/compileSdk(Version)?[[:space:]]*=?[[:space:]]*33/compileSdk = 36/g' "$f"
                echo "Patched compileSdk in $f"
              done

          # 3) Override Gradle por si queda alguno
          OVERRIDE='
          subprojects {
              afterEvaluate { project ->
                  if (project.hasProperty("android")) {
                      project.android {
                          if (compileSdkVersion == "android-33" || compileSdkVersion == 33) {
                              compileSdkVersion 36
                          }
                      }
                  }
              }
          }
          '
                    if [ -f android/build.gradle ]; then
                      grep -q 'compileSdkVersion 36' android/build.gradle || echo "$OVERRIDE" >> android/build.gradle
                    fi
                    if [ -f android/build.gradle.kts ]; then
                      grep -q 'compileSdkVersion(36)' android/build.gradle.kts || cat >> android/build.gradle.kts << 'KTS'
          
          subprojects {
              afterEvaluate {
                  val androidExt = extensions.findByName("android") as? com.android.build.gradle.BaseExtension
                  androidExt?.let {
                      val current = it.compileSdkVersion?.removePrefix("android-")?.toIntOrNull() ?: 0
                      if (current in 1..35) {
                          it.compileSdkVersion(36)
                      }
                  }
              }
          }
          KTS
                    fi
      - name: Build APK (Release)
        working-directory: src/mobile_app
        run: flutter build apk --release
      
      - name: Upload APK to Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v1
        with:
          files: src/mobile_app/build/app/outputs/apk/release/app-release.apk
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      
      - name: Upload APK as artifact
        uses: actions/upload-artifact@v4
        with:
          name: apk-release
          path: src/mobile_app/build/app/outputs/apk/release/app-release.apk
